<!-- Define que é um documento HTML5 -->
<!DOCTYPE html>

<!-- Define o idioma da página (ajuda acessibilidade e SEO) -->
<html lang="pt-BR">

<head>
    <!-- Permite caracteres especiais: ã, ç, é, ó... -->
    <meta charset="UTF-8">

    <!-- Faz a página funcionar em dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Texto que aparece na aba do navegador -->
    <title>RSC Academy — Aprenda a Programar</title>

    <!-- Importa o arquivo CSS externo -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Todo conteúdo visível fica aqui dentro -->
    <h1>Bem-vindo à Portal de Notí  cias do Adriel!</h1>
<h2>Portal de notícias da região</h2>

<!-- nav: Define o menu de navegação do site -->
<nav> 
    <!-- Logo / nome da empresa -->
    <div class="logo">RSC Academy</div>

    <!-- Lista de links -->
    <ul>
        <!-- li: cada item da lista -->
        <li><a href="#inicio">Início</a></li>
        <li><a href="#noticias">Notícias</a></li>
        <li><a href="#eventos">Eventos</a></li>
        <li><a href="#contato">Contato</a></li>
    </ul>

    <!-- Botão de ação -->
    <button class="btn-inscricao">Inscreve-se</button> 
</nav>
<br> <br>
<!-- iframe: janela para conteúdo externo -->
<!-- Troque VIDEO_ID pelo ID do vídeo do YouTube -->
<div class="video-container">
    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/yCP62j_Kw0g?si=XUtpWUxhtrV2ZC_U"
        title="Aula de HTML - RSC Academy"
        frameborder="0"
        allowfullscreen
    ></iframe>
</div>

<!-- src: caminho da imagem | alt: texto para acessibilidade -->
<img 
    src="assets/imagens/carro.webp"

    width="40%"
>

    width="200px"
>

    <link rel="stylesheet" href="css/style.css">

</html>
